<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            background: #302e2b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #262421;
            padding: 30px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        input,
        button {
            padding: 10px;
            font-size: 15px;
            border-radius: 4px;
            border: none;
        }

        input {
            background: #3c3935;
            color: #fff;
        }

        .btn {
            background: #769656;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Шахматы: Вход</h2>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button class="btn" onclick="auth('login')">Войти</button>
        <button class="btn" style="background:#555;" onclick="auth('register')">Регистрация</button>
        <span id="err" style="color:#ff6b6b; font-size:13px;"></span>
    </div>
    <script>
        if (localStorage.getItem('user_id')) window.location.href = '/dashboard';

        async function auth(type) {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch(`/api/auth/${type}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('username', data.username);
                window.location.href = '/dashboard';
            } else { document.getElementById('err').innerText = data.detail; }
        }
    </script>
</body>

</html>
